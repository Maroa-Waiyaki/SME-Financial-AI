[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenya-sme-financial-intelligence"
version = "0.1.0"
description = "Production-grade agentic AI financial intelligence platform for Kenyan SMEs."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"},
]
keywords = ["fintech", "agentic-ai", "langgraph", "sme", "kenya", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    # Web / APIs
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "django>=5.0.6,<5.1.0",
    "djangorestframework>=3.15.1,<3.16.0",
    "celery>=5.4.0,<5.5.0",
    "redis>=5.0.3,<5.1.0",

    # Data & Databases
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg2-binary>=2.9.9,<2.10.0",
    "alembic>=1.13.1,<1.14.0",
    "pandas>=2.2.2,<2.3.0",
    "numpy>=1.26.4,<2.0.0",

    # Configuration
    "pydantic>=2.7.3,<2.8.0",
    "pydantic-settings>=2.3.0,<2.4.0",
    "python-dotenv>=1.0.1,<1.1.0",

    # Agentic AI / LLMs
    "langchain>=0.2.0,<0.3.0",
    "langchain-openai>=0.1.8,<0.2.0",
    "langgraph>=0.0.69,<0.1.0",

    # Machine Learning
    "scikit-learn>=1.5.0,<1.6.0",
    "xgboost>=2.0.3,<2.1.0",
    "shap>=0.45.0,<0.46.0",
    "mlflow>=2.14.0,<2.15.0",


    # Vector DB / Documents
    "weaviate-client>=4.6.0,<4.7.0",
    "reportlab>=4.2.0,<4.3.0",

    # Utilities
    "httpx>=0.27.0,<0.28.0",
    "python-multipart>=0.0.9,<0.1.0",
    "jinja2>=3.1.4,<3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2,<8.3.0",
    "pytest-django>=4.8.0,<4.9.0",
    "pytest-asyncio>=0.23.7,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    "factory-boy>=3.3.0,<3.4.0",
    "ruff>=0.4.8,<0.5.0",
    "mypy>=1.10.0,<1.11.0",
    "coverage>=7.5.3,<7.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = false
strict_optional = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "apps"]
DJANGO_SETTINGS_MODULE = "django_app.settings"
