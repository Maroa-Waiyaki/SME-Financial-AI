{% extends "base.html" %}

{% block title %}Login - Kenya SME FI{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #005a87; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 4px;">Log in</button>
    </form>
</div>
{% endblock %}
