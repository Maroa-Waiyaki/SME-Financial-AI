{% extends "base.html" %}

{% block title %}AI Chat - Kenya SME FI{% endblock %}

{% block content %}
<h1>AI Financial Assistant</h1>

<div class="card">
    <p class="hint"><strong>Tip:</strong> Include a business ID and date range for best results, e.g. <em>"What is the revenue for B000001 from 2023-01-01 to 2023-12-31?"</em></p>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Ask a financial question..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</div>

<style>
    .hint { color: #555; margin-bottom: 1rem; }
    .chat-messages { max-height: 60vh; overflow-y: auto; margin-bottom: 1rem; padding: 0.5rem; background: #f9f9f9; border-radius: 6px; }
    .message { margin: 0.5rem 0; padding: 0.75rem; border-radius: 6px; line-height: 1.5; }
    .message.user { background: #005a87; color: white; margin-left: 2rem; }
    .message.assistant { background: #eef6fb; color: #111; margin-right: 2rem; white-space: pre-wrap; }
    .message .meta { font-size: 0.75rem; opacity: 0.8; margin-top: 0.25rem; }
    .chat-form { display: flex; gap: 0.5rem; }
    .chat-form input { flex: 1; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; }
    .chat-form button { padding: 0.75rem 1.5rem; background: #005a87; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .chat-form button:disabled { background: #999; }
    .loading { opacity: 0.7; }
</style>

<script>
    const messagesEl = document.getElementById('chat-messages');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    let history = [];

    function appendMessage(role, text, meta = '') {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        div.innerHTML = text.replace(/\n/g, '<br>');
        if (meta) {
            const metaEl = document.createElement('div');
            metaEl.className = 'meta';
            metaEl.textContent = meta;
            div.appendChild(metaEl);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = input.value.trim();
        if (!question) return;

        appendMessage('user', question);
        input.value = '';
        const btn = form.querySelector('button');
        btn.disabled = true;
        appendMessage('assistant', 'Thinking...', '');
        const thinking = messagesEl.lastChild;
        thinking.classList.add('loading');

        try {
            const res = await fetch('http://localhost:8000/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, history })
            });
            const data = await res.json();
            messagesEl.removeChild(thinking);

            if (res.ok) {
                history.push({ role: 'user', content: question });
                history.push({ role: 'assistant', content: data.response });
                appendMessage('assistant', data.response, 'Intent: ' + data.intent);
            } else {
                appendMessage('assistant', 'Error: ' + (data.detail || 'Could not get a response.'), '');
            }
        } catch (err) {
            messagesEl.removeChild(thinking);
            appendMessage('assistant', 'Error: ' + err.message, '');
        } finally {
            btn.disabled = false;
            input.focus();
        }
    });
</script>
{% endblock %}
