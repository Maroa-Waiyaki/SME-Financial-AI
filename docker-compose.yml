services:
  postgres:
    image: postgres:16-alpine
    container_name: sme_postgres
    environment:
      POSTGRES_DB: sme_financial_intelligence
      POSTGRES_USER: sme_user
      POSTGRES_PASSWORD: sme_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme_user -d sme_financial_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sme_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.25.0
    container_name: sme_weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 15s
      timeout: 10s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --default-artifact-root /app/mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/app/mlruns
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_fastapi
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    volumes:
      - .:/app

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_django
    command: python apps/django_app/manage.py runserver 0.0.0.0:8001
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_celery
    command: celery -A apps.django_app.celery worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app

volumes:
  postgres_data:
  weaviate_data:
  redis_data:
  mlruns:
